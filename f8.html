<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>需求数量</title>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Microsoft YaHei", sans-serif;
        }

        #chart-container {
            width: 100%;
            height: 100%;
        }
    </style>

</head>

<body>

<div id="chart-container"></div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const chart = echarts.init(document.getElementById("chart-container"));

    const quarters = [
        "2025Q1", "2025Q2", "2025Q3", "2025Q4",
        "2026Q1", "2026Q2", "2026Q3", "2026Q4"
    ];

    // 按需求状态拆分
    const STATUS = [
        { name: "已上线", color: "#10B981", data: [8, 12, 10, 15, 18, 22, 21, 24] },
        { name: "建设中", color: "#3B82F6", data: [3, 4, 5, 4, 6, 7, 6, 8] },
        { name: "审核中", color: "#F59E0B", data: [5, 6, 4, 7, 8, 9, 7, 10] },
        { name: "已拒绝", color: "#8B5CF6", data: [2, 2, 2, 4, 3, 4, 4, 4] }
    ];

    const option = {

        color: STATUS.map(function (s) { return s.color; }),

        title: {

            text: "需求数量",

            left: "2%",

            top: "2%",

            textStyle: {

                color: "#000",

                fontSize: 16,

                fontWeight: "bold"

            }

        },

        tooltip: {

            trigger: "axis",

            axisPointer: {

                type: "shadow"

            },

            formatter: function (params) {

                let total = 0;

                let html = params[0].axisValue + "<br/>";

                params.forEach(function (p) {

                    total += p.value;

                    html += p.marker + p.seriesName + "：" + p.value + " 条<br/>";

                });

                html += "<b>当季合计：" + total + " 条</b>";

                return html;

            }

        },

        legend: {

            orient: "horizontal",

            right: "3%",

            top: "4%",

            itemWidth: 14,

            itemHeight: 14,

            textStyle: {

                color: "#000",

                fontSize: 12

            }

        },

        grid: {

            left: "2%",

            right: "4%",

            top: "24%",

            bottom: "10%",

            containLabel: true

        },

        xAxis: {

            type: "category",

            data: quarters,

            axisLabel: {

                color: "#000",

                interval: 0

            },

            axisLine: {

                lineStyle: {

                    color: "#d1d5db"

                }

            },

            axisTick: {

                show: false

            }

        },

        yAxis: {

            type: "value",

            name: "需求数量(条)",

            min: 0,

            max: 50,

            interval: 10,

            nameTextStyle: {

                color: "#000",

                padding: [0, 0, 8, -24]

            },

            axisLabel: {

                color: "#000"

            },

            splitLine: {

                lineStyle: {

                    color: "#f3f4f6"

                }

            }

        },

        series: STATUS.map(function (s, i) {

            return {

                name: s.name,

                type: "bar",

                stack: "total",

                barWidth: "46%",

                data: s.data,

                itemStyle: {

                    color: s.color,

                    borderRadius: i === STATUS.length - 1 ? [4, 4, 0, 0] : 0

                },

                label: {

                    show: i === STATUS.length - 1,

                    position: "top",

                    color: "#374151",

                    fontSize: 12,

                    formatter: function (p) {

                        let sum = 0;

                        STATUS.forEach(function (st) {

                            sum += st.data[p.dataIndex];

                        });

                        return sum;

                    }

                }

            };

        })

    };

    chart.setOption(option);

    window.addEventListener("resize", function () {

        chart.resize();

    });

});

</script>

</body>

</html>
