<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Changzhou North Station Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#f5f7fa;
}

#map{
    width:100%;
    height:100%;
}

/* 去掉版权 */

.leaflet-control-attribution{
    display:none !important;
}

/* 去掉缩放按钮 */

.leaflet-control-zoom{
    display:none !important;
}

/* 去掉焦点边框 */

.leaflet-container{
    outline:none;
    background:#eef2f6;
    font-family:"Microsoft YaHei";
}

/* 鼠标样式 */

.leaflet-grab{
    cursor:grab;
}

.leaflet-dragging .leaflet-grab{
    cursor:grabbing;
}

/* 让瓦片缩放更平滑 */

.leaflet-tile{
    image-rendering:auto;
}

</style>

</head>

<body>

<div id="map"></div>

<script>

//=======================
// 创建地图
//=======================

const map = L.map('map',{

    zoomControl:false,

    attributionControl:false,

    zoomSnap:0.5,

    zoomDelta:0.5,

    wheelPxPerZoomLevel:120,

    preferCanvas:true

});

//=======================
// 常州北站
//=======================

map.setView(
    [31.8604,119.9738],
    15
);

//=======================
// 科技浅灰底图
//=======================

L.tileLayer(

'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',

{

maxZoom:20,

minZoom:12,

subdomains:'abcd',

updateWhenIdle:true,

keepBuffer:6

}

).addTo(map);

//=======================
// 浏览器窗口变化
//=======================

window.addEventListener("resize",function(){

    map.invalidateSize();

});

//=======================
// Axure页面切换时刷新地图
//=======================

setTimeout(function(){

    map.invalidateSize();

},300);

setTimeout(function(){

    map.invalidateSize();

},1000);

</script>

</body>
</html>
