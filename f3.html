<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指标目录数量</title>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Microsoft YaHei", sans-serif;
        }

        #chart-container {
            width: 100%;
            height: 100%;
        }
    </style>

</head>

<body>

<div id="chart-container"></div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const chart = echarts.init(document.getElementById("chart-container"));

    // 四大类颜色与「资源分类占比」保持一致
    const CATS = [
        {
            value: 5,
            name: "交通运行感知",
            color: "#3B82F6",
            items: "路口运行监测、路段运行评价、路网运行评价、道路预测预警、公路事件监测"
        },
        {
            value: 6,
            name: "综合出行洞察",
            color: "#10B981",
            items: "人流热力分析、车流运行分析、通勤走廊分析、出行方式分析、OD迁徙分析、流量分担分析"
        },
        {
            value: 4,
            name: "公共交通运营",
            color: "#F59E0B",
            items: "公交线路资源、公交车辆资源、场站资源管理、运营监测分析"
        },
        {
            value: 4,
            name: "低空空域感知",
            color: "#8B5CF6",
            items: "飞行运行监测、飞行问题监测、空域资源管理、低空感知应用"
        }
    ];

    const option = {

        title: {

            text: "指标目录数量",

            left: "2%",

            top: "2%",

            textStyle: {

                color: "#000",

                fontSize: 16,

                fontWeight: "bold"

            }

        },

        tooltip: {

            trigger: "axis",

            axisPointer: {

                type: "shadow"

            },

            extraCssText: "max-width:320px;white-space:normal;line-height:1.6;",

            formatter: function (params) {

                const item = CATS[params[0].dataIndex];

                return item.name +
                    "<br/>指标目录数量：<b>" + item.value + " 个</b>" +
                    "<br/>" + item.items;

            }

        },

        grid: {

            left: "2%",

            right: "4%",

            top: "22%",

            bottom: "12%",

            containLabel: true

        },

        xAxis: {

            type: "category",

            data: CATS.map(function (c) { return c.name; }),

            axisLabel: {

                color: "#000",

                interval: 0,

                fontSize: 13

            },

            axisLine: {

                lineStyle: {

                    color: "#d1d5db"

                }

            },

            axisTick: {

                show: false

            }

        },

        yAxis: {

            type: "value",

            name: "指标目录数量(个)",

            min: 0,

            max: 8,

            interval: 2,

            nameTextStyle: {

                color: "#000",

                padding: [0, 0, 8, -24]

            },

            axisLabel: {

                color: "#000"

            },

            splitLine: {

                lineStyle: {

                    color: "#f3f4f6"

                }

            }

        },

        series: [

            {

                name: "指标目录数量",

                type: "bar",

                barWidth: "38%",

                data: CATS.map(function (c) {

                    return {

                        value: c.value,

                        itemStyle: {

                            color: c.color,

                            borderRadius: [4, 4, 0, 0]

                        }

                    };

                }),

                label: {

                    show: true,

                    position: "top",

                    color: "#374151",

                    fontSize: 13,

                    fontWeight: "bold",

                    formatter: "{c} 个"

                }

            }

        ]

    };

    chart.setOption(option);

    window.addEventListener("resize", function () {

        chart.resize();

    });

});

</script>

</body>

</html>
