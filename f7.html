<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API调用趋势</title>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Microsoft YaHei", sans-serif;
        }

        #chart-container {
            width: 100%;
            height: 100%;
        }
    </style>

</head>

<body>

<div id="chart-container"></div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const chart = echarts.init(document.getElementById("chart-container"));

    const months = [
        "01月", "02月", "03月", "04月", "05月", "06月",
        "07月", "08月", "09月", "10月", "11月", "12月"
    ];

    // 2026 年累计调用次数（万次）
    const cumulative = [3.2, 7.1, 11.8, 17.5, 24.9, 33.6, 43.5, 55.2, 68.8, 83.9, 100.4, 118.6];

    // 当月调用次数（万次）
    const monthly = [3.2, 3.9, 4.7, 5.7, 7.4, 8.7, 9.9, 11.7, 13.6, 15.1, 16.5, 18.2];

    const option = {

        color: ["#3B82F6", "#10B981"],

        title: {

            text: "API调用趋势",

            left: "2%",

            top: "2%",

            textStyle: {

                color: "#000",

                fontSize: 16,

                fontWeight: "bold"

            }

        },

        tooltip: {

            trigger: "axis",

            formatter: function (params) {

                let html = params[0].axisValue + "<br/>";

                params.forEach(function (p) {

                    html += p.marker + p.seriesName + "：" + p.value + " 万次<br/>";

                });

                return html;

            }

        },

        legend: {

            orient: "horizontal",

            right: "3%",

            top: "4%",

            itemWidth: 14,

            itemHeight: 14,

            textStyle: {

                color: "#000",

                fontSize: 12

            }

        },

        grid: {

            left: "2%",

            right: "4%",

            top: "24%",

            bottom: "10%",

            containLabel: true

        },

        xAxis: {

            type: "category",

            boundaryGap: false,

            data: months,

            axisLabel: {

                color: "#000",

                interval: 0,

                fontSize: 12

            },

            axisLine: {

                lineStyle: {

                    color: "#d1d5db"

                }

            },

            axisTick: {

                show: false

            }

        },

        yAxis: [

            {

                type: "value",

                name: "累计调用(万次)",

                min: 0,

                max: 120,

                interval: 30,

                nameTextStyle: {

                    color: "#000",

                    padding: [0, 0, 8, -18]

                },

                axisLabel: {

                    color: "#000"

                },

                splitLine: {

                    lineStyle: {

                        color: "#f3f4f6"

                    }

                }

            },

            {

                type: "value",

                name: "当月调用(万次)",

                min: 0,

                max: 40,

                interval: 10,

                show: false

            }

        ],

        series: [

            {

                name: "累计调用次数",

                type: "line",

                smooth: true,

                symbol: "circle",

                symbolSize: 6,

                yAxisIndex: 0,

                data: cumulative,

                lineStyle: {

                    width: 3,

                    color: "#3B82F6"

                },

                itemStyle: {

                    color: "#3B82F6"

                },

                areaStyle: {

                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [

                        { offset: 0, color: "rgba(59,130,246,0.32)" },

                        { offset: 1, color: "rgba(59,130,246,0.02)" }

                    ])

                },

                label: {

                    show: true,

                    position: "top",

                    color: "#374151",

                    fontSize: 11,

                    formatter: function (p) {

                        return p.dataIndex === cumulative.length - 1 ? p.value : "";

                    }

                }

            },

            {

                name: "当月调用次数",

                type: "bar",

                yAxisIndex: 1,

                barWidth: "26%",

                data: monthly,

                itemStyle: {

                    color: "#10B981",

                    borderRadius: [3, 3, 0, 0],

                    opacity: 0.85

                }

            }

        ]

    };

    chart.setOption(option);

    window.addEventListener("resize", function () {

        chart.resize();

    });

});

</script>

</body>

</html>
