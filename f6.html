<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热门资源排行TOP5</title>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Microsoft YaHei", sans-serif;
        }

        #chart-container {
            width: 100%;
            height: 100%;
        }
    </style>

</head>

<body>

<div id="chart-container"></div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const chart = echarts.init(document.getElementById("chart-container"));

    // 由小到大排序（y 轴 inverse 后最大值显示在最上方）
    const names = [
        "堵点预警-实时",
        "区域实时人流&活力指数",
        "评诊治-拥堵延时指数-道路全量实时排行",
        "交通路况-原始路况-路况查询-2024版",
        "实时路口平均速度查询"
    ];

    const values = [15.3, 19.7, 24.1, 28.4, 32.6];

    const option = {

        title: {

            text: "热门资源排行TOP5",

            left: "2%",

            top: "2%",

            textStyle: {

                color: "#000",

                fontSize: 16,

                fontWeight: "bold"

            }

        },

        tooltip: {

            trigger: "axis",

            axisPointer: {

                type: "shadow"

            },

            formatter: function (params) {

                const p = params[0];

                return p.name +
                    "<br/>调用次数：<b>" +
                    p.value +
                    " 万次</b>";

            }

        },

        grid: {

            left: "2%",

            right: "8%",

            top: "24%",

            bottom: "10%",

            containLabel: true

        },

        xAxis: {

            type: "value",

            name: "调用次数(万次)",

            min: 0,

            max: 40,

            interval: 10,

            nameTextStyle: {

                color: "#000",

                padding: [0, 0, 8, 0]

            },

            axisLabel: {

                color: "#000"

            },

            axisLine: {

                show: true,

                lineStyle: {

                    color: "#d1d5db"

                }

            },

            splitLine: {

                lineStyle: {

                    color: "#f3f4f6"

                }

            }

        },

        yAxis: {

            type: "category",

            inverse: true,

            data: names,

            axisLabel: {

                color: "#000",

                fontSize: 12,

                width: 200,

                overflow: "truncate"

            },

            axisLine: {

                lineStyle: {

                    color: "#d1d5db"

                }

            },

            axisTick: {

                show: false

            }

        },

        series: [

            {

                name: "调用次数",

                type: "bar",

                barWidth: "48%",

                data: values,

                itemStyle: {

                    color: "#3B82F6",

                    borderRadius: [0, 4, 4, 0]

                },

                label: {

                    show: true,

                    position: "right",

                    color: "#374151",

                    fontSize: 12,

                    formatter: "{c}"

                }

            }

        ]

    };

    chart.setOption(option);

    window.addEventListener("resize", function () {

        chart.resize();

    });

});

</script>

</body>

</html>
